<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e">
        <animate attributeName="stop-color" values="#1a1a2e;#16213e;#1a1a2e" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f3460">
        <animate attributeName="stop-color" values="#0f3460;#e94560;#0f3460" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      .title {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 64px;
        font-weight: bold;
        fill: #ffffff;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 24px;
        fill: #e94560;
        text-anchor: middle;
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="15" ry="15"/>
  <text x="50%" y="45%" class="title" dy=".3em">Free-Kimi-K3</text>
  <text x="50%" y="75%" class="subtitle">Access Moonshot AI's K3 Model</text>
  <circle cx="100" cy="50" r="2" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="3" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="40" r="1.5" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
